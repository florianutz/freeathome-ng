name: Home Assistant beta

# Early warning for upcoming Home Assistant releases: runs the test suite against
# the newest Home Assistant pre-release every week and on demand.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  pytest-beta:
    name: Run pytest on Home Assistant beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies with the newest Home Assistant pre-release
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install --upgrade --pre homeassistant
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      # Registry snapshots are pinned to the HA version in requirements_test.txt.
      - name: Run unit tests
        run: pytest -k "not test_platform_snapshot"
