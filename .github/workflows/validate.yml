name: Validate & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
<<<<<<< HEAD
          pip install -r requirements_test.txt
=======
          pip install aiohttp pytest pytest-asyncio pytest-cov pyyaml ruff mypy
>>>>>>> origin/claude/project-thread-02ukwt
      - name: Lint with ruff
        run: ruff check custom_components tests scripts
      - name: Check formatting with ruff
        run: ruff format --check custom_components tests scripts
      - name: Type-check api/ with mypy (strict)
        run: mypy
      - name: Run unit tests with coverage
        run: pytest --cov --cov-report=term
      - name: Check translation parity
        run: python3 scripts/check_translations.py

  hassfest:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
