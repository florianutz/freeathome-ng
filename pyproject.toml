[project]
name = "freeathome-ng"
version = "1.0.0"
description = "Next-generation Home Assistant integration for ABB/Busch-Jaeger free@home built on the official Local REST & WebSocket API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["custom_components"]

[tool.coverage.run]
source = ["custom_components/freeathome_ng"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
# Strict typing is enforced for the HA-free `api/` layer now (Platinum: strict-typing).
# The HA layer joins once real Home Assistant is installed in the test env (work package AP2/AP6).
python_version = "3.12"
files = ["custom_components/freeathome_ng/api"]
strict = true
follow_imports = "silent"
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
