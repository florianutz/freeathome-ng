rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: local_push integration; all state arrives via the SysAP WebSocket.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: todo
    comment: README has no removal section (AP7).
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: todo
    comment: Options are mentioned but not documented as a parameter list (AP7).
  docs-installation-parameters:
    status: todo
    comment: Setup fields not documented individually (AP7).
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: Coverage is 81 % (line+branch) against real HA 2026.10; target is >95 % (AP3, AP4).

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update:
    status: todo
    comment: AP7.
  docs-examples: done
  docs-known-limitations:
    status: todo
    comment: AP7.
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting:
    status: todo
    comment: AP7.
  docs-use-cases:
    status: todo
    comment: AP7.
  dynamic-devices: done
  entity-category:
    status: done
    comment: Timer program switches are config entities; no other entity is configuration or diagnostics.
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: The Beaufort wind force (duplicate of wind speed) starts disabled.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: >-
      No persistent problem the user must fix outside the existing flows. Rejected credentials
      start reauthentication; an unreachable SysAP, a disabled Local API or firmware below 2.6
      fail setup with a translated error and retry; the legacy entry is removed by the cutover
      itself, and running both integrations side by side is supported.
  stale-devices:
    status: done
    comment: >-
      devicesRemoved frames remove the device with its channel devices and entities; on setup,
      devices and channels missing from the SysAP configuration are removed.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: mypy --strict passes for api/; the HA layer follows once real HA is in the test env (AP6).
